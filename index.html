<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>測試頁籤</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{padding:16px;background:#f7f8fa;}
.nav-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.nav-btn{padding:12px 18px;border:none;border-radius:12px;font-size:16px;background:#e5e7eb;cursor:pointer;}
.nav-btn.active{background:#2563eb;color:#fff;}
.tab-page{display:none;}
.tab-page.active{display:block;}
.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:16px;}
</style>
</head>
<body>
<div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('overview')">總覽</button>
    <button class="nav-btn" onclick="switchTab('asset')">資產管理</button>
    <button class="nav-btn" onclick="switchTab('receivable')">應收帳款</button>
    <button class="nav-btn" onclick="switchTab('cashrecord')">出入金紀錄</button>
</div>

<div id="overview" class="tab-page active">
    <div class="card">這是【總覽頁】</div>
</div>
<div id="asset" class="tab-page">
    <div class="card">這是【資產管理頁】</div>
</div>
<div id="receivable" class="tab-page">
    <div class="card">這是【應收帳款頁】</div>
</div>
<div id="cashrecord" class="tab-page">
    <div class="card">這是【出入金紀錄頁】</div>
</div>

<script>
function switchTab(targetId){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(targetId).classList.add('active');
}
</script>
</body>
</html>
