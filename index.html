<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資身價儀表板</title>
<!-- 只載入套件，但完全不呼叫、不初始化 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:system-ui, -apple-system, sans-serif;}
body{padding:16px;background:#f7f8fa;padding-bottom:40px;}
.nav-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
.nav-btn{padding:12px 18px;border:none;border-radius:12px;font-size:16px;background:#e5e7eb;cursor:pointer;-webkit-appearance:none;}
.nav-btn.active{background:#2563eb;color:#fff;}
.tab-page{display:none;}
.tab-page.active{display:block;}
.card{background:#fff;padding:22px;border-radius:16px;margin-bottom:18px;box-shadow:0 2px 6px #0000000c;}
</style>
</head>
<body>
<div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('overview')">總覽</button>
    <button class="nav-btn" onclick="switchTab('asset')">資產管理</button>
    <button class="nav-btn" onclick="switchTab('receivable')">應收帳款</button>
    <button class="nav-btn" onclick="switchTab('cashrecord')">出入金紀錄</button>
</div>

<div id="overview" class="tab-page active">
    <div class="card">總覽頁測試</div>
</div>
<div id="asset" class="tab-page">
    <div class="card">資產管理頁測試</div>
</div>
<div id="receivable" class="tab-page">
    <div class="card">應收帳款頁測試</div>
</div>
<div id="cashrecord" class="tab-page">
    <div class="card">出入金紀錄頁測試</div>
</div>

<script>
function switchTab(targetId){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(targetId).classList.add('active');
}
// 重點：沒有任何 supabase.createClient、沒有任何查詢程式
</script>
</body>
</html>
