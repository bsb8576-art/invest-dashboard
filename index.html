<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資資產儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif;}
body{background:#f7f8fa;padding:16px;}
.nav-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.nav-btn{padding:10px 18px;border:none;border-radius:8px;font-size:15px;cursor:pointer;}
.nav-btn.active{background:#2563eb;color:white;}
.nav-btn:not(.active){background:#e5e7eb;color:#222;}

.tab-page{display:none;}
.tab-page.active{display:block;}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px #00000012;margin-bottom:16px;}
.input-row{display:flex;gap:10px;margin:8px 0;align-items:center;flex-wrap:wrap;}
input,select{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
.month-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;text-align:center;}
.stat-value{font-size:22px;font-weight:bold;margin-top:4px;}
.green{color:#16a34a;}.red{color:#dc2626;}.gray{color:#333;}
table{width:100%;border-collapse:collapse;margin-top:12px;}
th,td{border:1px solid #eee;padding:10px;text-align:left;font-size:14px;}
th{background:#f3f4f6;}
.btn{padding:7px 12px;border-radius:6px;border:none;cursor:pointer;background:#2563eb;color:white;}
.btn-del{background:#dc2626;}
</style>
</head>
<body>
<div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('overview')">總覽</button>
    <button class="nav-btn" onclick="switchTab('asset')">資產管理</button>
    <button class="nav-btn" onclick="switchTab('receivable')">應收帳款</button>
    <button class="nav-btn" onclick="switchTab('cashflow')">出入金紀錄</button>
</div>

<div id="overview" class="tab-page active">
    <div class="card">
        <h4>本月統計</h4>
        <div class="input-row">
            <label>收入：</label>
            <input type="number" id="monthIncome" step="0.01" oninput="calcBalance()">
            <label>支出：</label>
            <input type="number" id="monthOutlay" step="0.01" oninput="calcBalance()">
        </div>
        <div class="month-stat">
            <div>
                <div>收入</div>
                <div id="dispIncome" class="stat-value green">0</div>
            </div>
            <div>
                <div>支出</div>
                <div id="dispOutlay" class="stat-value red">0</div>
            </div>
            <div>
                <div>月度淨增</div>
                <div id="dispNet" class="stat-value gray">0</div>
            </div>
        </div>
    </div>
</div>

<div id="asset" class="tab-page">
    <div class="card">
        <h4>新增資產</h4>
        <div class="input-row">
            <label>資產名稱</label>
            <input type="text" id="assetName" placeholder="2330 / 00675L">
            <label>類別</label>
            <select id="assetType">
                <option value="台股">台股</option>
                <option value="加密貨幣">加密貨幣</option>
            </select>
            <label>持有數量</label>
            <input type="number" id="assetAmount" step="0.0001">
            <label>成本單價(TWD)</label>
            <input type="number" id="assetCost" step="0.01">
            <button class="btn" onclick="addAsset()">新增</button>
        </div>
    </div>
    <div class="card">
        <h4>資產清單</h4>
        <table id="assetTable">
            <thead>
                <tr>
                    <th>名稱</th>
                    <th>類別</th>
                    <th>數量</th>
                    <th>成本單價</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div id="receivable" class="tab-page">
    <div class="card">
        <h4>應收帳款（待開發）</h4>
    </div>
</div>

<div id="cashflow" class="tab-page">
    <div class="card">
        <h4>入金出金紀錄（待開發）</h4>
    </div>
</div>

<script>
// 先空宣告全域函數，避免一載入就報錯找不到
let supabase;
function switchTab(){}
function calcBalance(){}
async function loadAssets(){}
async function addAsset(){}
async function delAsset(){}

// 等待外部supabase套件載入完成後，覆寫真正函數
window.addEventListener("load", async function(){
    const SUPABASE_CONFIG = {
      URL: "https://gbzyjeevvtwxqtnmbshe.supabase.co",
      KEY: "sb_publishable_sl0v25ghGOPXQw4SmHlC6g_m8-NLcd9"
    };
    supabase = window.supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.KEY);

    // 頁籤切換
    switchTab = function(targetId){
        document.querySelectorAll('.nav-btn').forEach(btn=>btn.classList.remove('active'));
        document.querySelectorAll('.tab-page').forEach(page=>page.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(targetId).classList.add('active');
    }

    // 收支計算
    calcBalance = function(){
        const income = parseFloat(document.getElementById("monthIncome").value) || 0;
        const outlay = parseFloat(document.getElementById("monthOutlay").value) || 0;
        const net = income - outlay;

        document.getElementById("dispIncome").textContent = income;
        document.getElementById("dispOutlay").textContent = outlay;
        document.getElementById("dispNet").textContent = net;

        document.getElementById("dispNet").className = "stat-value";
        if(net > 0) document.getElementById("dispNet").classList.add("green");
        else if(net < 0) document.getElementById("dispNet").classList.add("red");
    }

    // 資產讀取
    loadAssets = async function(){
        const {data} = await supabase.from("assets").select("*");
        const tbody = document.querySelector("#assetTable tbody");
        tbody.innerHTML = "";
        data.forEach(item=>{
            const tr = document.createElement("tr");
            tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.type}</td>
            <td>${item.amount}</td>
            <td>${item.cost_price}</td>
            <td><button class="btn btn-del" onclick="delAsset('${item.id}')">刪除</button></td>
            `;
            tbody.appendChild(tr);
        })
    }

    addAsset = async function(){
        const name = document.getElementById("assetName").value;
        const type = document.getElementById("assetType").value;
        const amount = parseFloat(document.getElementById("assetAmount").value);
        const cost = parseFloat(document.getElementById("assetCost").value);
        if(!name || !amount) return alert("請填寫完整資產資訊");
        await supabase.from("assets").insert([{name,type,amount,cost_price:cost}]);
        loadAssets();
        document.getElementById("assetName").value = "";
        document.getElementById("assetAmount").value = "";
        document.getElementById("assetCost").value = "";
    }

    delAsset = async function(id){
        if(!confirm("確認刪除此筆資產?")) return;
        await supabase.from("assets").delete().eq("id",id);
        loadAssets();
    }

    calcBalance();
    loadAssets();
})
</script>
</body>
</html>
