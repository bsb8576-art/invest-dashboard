<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資資產儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif;}
body{background:#f7f8fa;padding:16px;}
.nav-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.nav-btn{padding:10px 18px;border:none;border-radius:8px;font-size:15px;cursor:pointer;}
.nav-btn.active{background:#2563eb;color:white;}
.nav-btn:not(.active){background:#e5e7eb;color:#222;}

.tab-page{display:none;}
.tab-page.active{display:block;}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px #00000012;margin-bottom:16px;}
.input-row{display:flex;gap:10px;margin:8px 0;align-items:center;flex-wrap:wrap;}
input,select{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
.month-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;text-align:center;}
.stat-value{font-size:22px;font-weight:bold;margin-top:4px;}
.green{color:#16a34a;}.red{color:#dc2626;}.gray{color:#333;}
table{width:100%;border-collapse:collapse;margin-top:12px;}
th,td{border:1px solid #eee;padding:10px;text-align:left;font-size:14px;}
th{background:#f3f4f6;}
.btn{padding:7px 12px;border-radius:6px;border:none;cursor:pointer;background:#2563eb;color:white;}
.btn-del{background:#dc2626;}
</style>
</head>
<body>
<div class="nav-bar">
    <button class="nav-btn active" data-target="overview">總覽</button>
    <button class="nav-btn" data-target="asset">資產管理</button>
    <button class="nav-btn" data-target="receivable">應收帳款</button>
    <button class="nav-btn" data-target="cashflow">出入金紀錄</button>
</div>

<div id="overview" class="tab-page active">
    <div class="card">
        <h4>本月統計</h4>
        <div class="input-row">
            <label>收入：</label>
            <input type="number" id="monthIncome" step="0.01">
            <label>支出：</label>
            <input type="number" id="monthOutlay" step="0.01">
        </div>
        <div class="month-stat">
            <div>
                <div>收入</div>
                <div id="dispIncome" class="stat-value green">0</div>
            </div>
            <div>
                <div>支出</div>
                <div id="dispOutlay" class="stat-value red">0</div>
            </div>
            <div>
                <div>月度淨增</div>
                <div id="dispNet" class="stat-value gray">0</div>
            </div>
        </div>
    </div>
</div>

<div id="asset" class="tab-page">
    <div class="card">
        <h4>新增資產</h4>
        <div class="input-row">
            <label>資產名稱</label>
            <input type="text" id="assetName" placeholder="2330 / SOL">
            <label>類別</label>
            <select id="assetType">
                <option value="台股">台股</option>
                <option value="加密貨幣">加密貨幣</option>
            </select>
            <label>幣別</label>
            <select id="assetCurrency">
                <option value="TWD">TWD 新台幣</option>
                <option value="USD">USD 美元</option>
            </select>
            <label>持有數量</label>
            <input type="number" id="assetAmount" step="0.0001">
            <label>成本單價</label>
            <input type="number" id="assetCost" step="0.01">
            <button class="btn" id="btnAddAsset">新增</button>
        </div>
    </div>
    <div class="card">
        <h4>資產清單</h4>
        <table id="assetTable">
            <thead>
                <tr>
                    <th>名稱</th>
                    <th>類別</th>
                    <th>幣別</th>
                    <th>數量</th>
                    <th>成本單價</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div id="receivable" class="tab-page">
    <div class="card">
        <h4>應收帳款（待開發）</h4>
    </div>
</div>

<div id="cashflow" class="tab-page">
    <div class="card">
        <h4>入金出金紀錄（待開發）</h4>
    </div>
</div>

<script>
// 介面邏輯優先執行
const incomeInput = document.getElementById("monthIncome");
const outlayInput = document.getElementById("monthOutlay");
const dispIncome = document.getElementById("dispIncome");
const dispOutlay = document.getElementById("dispOutlay");
const dispNet = document.getElementById("dispNet");

function calcBalance(){
    const income = parseFloat(incomeInput.value) || 0;
    const outlay = parseFloat(outlayInput.value) || 0;
    const net = income - outlay;
    dispIncome.textContent = income;
    dispOutlay.textContent = outlay;
    dispNet.textContent = net;
    dispNet.className = "stat-value";
    if(net > 0) dispNet.classList.add("green");
    else if(net < 0) dispNet.classList.add("red");
}
incomeInput.addEventListener("input", calcBalance);
outlayInput.addEventListener("input", calcBalance);
calcBalance();

// 頁籤切換
document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        const targetId = btn.dataset.target;
        document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
        document.querySelectorAll(".tab-page").forEach(p=>p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(targetId).classList.add("active");
    })
})

// Supabase
let supabaseClient;
async function initDB(){
    const SUPABASE_CONFIG = {
      URL: "https://gbzyjeevvtwxqtnmbshe.supabase.co",
      KEY: "sb_publishable_sl0v25ghGOPXQw4SmHlC6g_m8-NLcd9"
    };
    supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.KEY);
    loadAssets();
}

async function loadAssets(){
    const {data,error} = await supabaseClient.from("assets").select("*");
    if(error){
        alert("讀取資產失敗:"+error.message);
        return;
    }
    const tbody = document.querySelector("#assetTable tbody");
    tbody.innerHTML = "";
    data.forEach(item=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
        <td>${item.name}</td>
        <td>${item.type}</td>
        <td>${item.currency}</td>
        <td>${item.amount}</td>
        <td>${item.cost_price}</td>
        <td><button class="btn btn-del" data-id="${item.id}">刪除</button></td>
        `;
        tbody.appendChild(tr);
    })
    document.querySelectorAll(".btn-del").forEach(delBtn=>{
        delBtn.onclick = ()=> delAsset(delBtn.dataset.id);
    })
}

async function addAsset(){
    const name = document.getElementById("assetName").value.trim();
    const type = document.getElementById("assetType").value;
    const currency = document.getElementById("assetCurrency").value;
    const amount = parseFloat(document.getElementById("assetAmount").value);
    const cost = parseFloat(document.getElementById("assetCost").value);
    
    if(!name || isNaN(amount) || isNaN(cost)){
        alert("請完整填寫資產資料");
        return;
    }

    const {error} = await supabaseClient.from("assets").insert([
        {name, type, currency, amount, cost_price:cost}
    ]);
    if(error){
        alert("新增失敗:"+error.message);
        return;
    }
    //清空輸入
    document.getElementById("assetName").value = "";
    document.getElementById("assetAmount").value = "";
    document.getElementById("assetCost").value = "";
    loadAssets();
}

async function delAsset(id){
    if(!confirm("確認刪除此筆資產?")) return;
    const {error} = await supabaseClient.from("assets").delete().eq("id",id);
    if(error) alert("刪除失敗:"+error.message);
    else loadAssets();
}

document.getElementById("btnAddAsset").addEventListener("click", addAsset);

setTimeout(()=>{
    initDB();
}, 800);
</script>
</body>
</html>
